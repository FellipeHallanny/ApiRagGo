services:
  db:
    image: pgvector/pgvector:pg16
    container_name: apirag_postgres
    restart: always
    environment:
      POSTGRES_DB: apirag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
